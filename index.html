<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <title>TaniPintar - Manajemen Lahan</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  
  <!-- Google Fonts & Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <!-- Tailwind Config Custom (Primary Color: #48A111) -->
  <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#48A111",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101822",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "3xl": "1.5rem", "full": "9999px"},
                },
            },
        }
  </script>

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
        body { 
            font-family: 'Space Grotesk', sans-serif; 
            min-height: max(884px, 100dvh); 
        }
        .chart-gradient { 
            background: linear-gradient(180deg, rgba(72, 161, 17, 0.2) 0%, rgba(72, 161, 17, 0) 100%); 
        }
        .material-symbols-outlined { 
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; 
        }
        .icon-fill { 
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; 
        }
        .active-tab {
            border-bottom: 3px solid #48A111;
            color: #48A111;
        }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUpModal { from { opacity: 0; transform: translateY(100%); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .animate-modal { animation: slideUpModal 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        ::-webkit-scrollbar { width: 0px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col max-w-md mx-auto relative shadow-2xl overflow-x-hidden">

<div id="root"></div>

<script type="module">
  // Import Firebase standard untuk Production
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
  import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  window.firebaseModules = { initializeApp, getAuth, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc };
</script>

<script type="text/babel">
  const { useState, useEffect, useMemo } = React;

  // =====================================================================
  // --- MASUKKAN FIREBASE CONFIG ANDA DI SINI ---
  // =====================================================================
  const firebaseConfig = {
  apiKey: "AIzaSyBfq_6_fwLD3Pxx-y2j-OOG39r_RhTTz8E",
  authDomain: "pantaukebunku.vercel.app",
  projectId: "pantaukebunku",
  storageBucket: "pantaukebunku.firebasestorage.app",
  messagingSenderId: "20781212772",
  appId: "1:20781212772:web:2270451f2b3ce5368c6b71",
  };
  // =====================================================================

  let app, auth, db, googleProvider;
  
  setTimeout(() => {
    if (window.firebaseModules) {
      app = window.firebaseModules.initializeApp(firebaseConfig);
      auth = window.firebaseModules.getAuth(app);
      db = window.firebaseModules.getFirestore(app);
      googleProvider = new window.firebaseModules.GoogleAuthProvider();
    }
  }, 100);

  // --- CONSTANTS & DEFAULTS ---
  const TABS = { HOME: 'home', KEBUN: 'kebun', KEUANGAN: 'keuangan', PROFIL: 'profil' };

  const DEFAULT_CROPS = [
    { id: 'default_sayuran', name: 'Sayuran', estDays: 40, color: 'text-green-500', bg: 'bg-green-100', icon: 'eco', isDefault: true, image: 'https://images.unsplash.com/photo-1598170845058-32b9d6a5da37?q=80&w=600&auto=format&fit=crop' },
    { id: 'default_singkong', name: 'Singkong / Ubi', estDays: 270, color: 'text-amber-600', bg: 'bg-amber-100', icon: 'compost', isDefault: true, image: 'https://images.unsplash.com/photo-1592860986145-21d7b3e0c034?q=80&w=600&auto=format&fit=crop' },
    { id: 'default_tebu', name: 'Tebu / Perkebunan', estDays: 330, color: 'text-orange-500', bg: 'bg-orange-100', icon: 'grass', isDefault: true, image: 'https://images.unsplash.com/photo-1599859530463-cd7cdba9bdf3?q=80&w=600&auto=format&fit=crop' }
  ];

  const DEFAULT_CATEGORIES = [
    { id: 'default_pupuk', name: 'Beli Pupuk', type: 'Pengeluaran', isDefault: true },
    { id: 'default_bibit', name: 'Beli Bibit', type: 'Pengeluaran', isDefault: true },
    { id: 'default_pekerja', name: 'Tenaga Kerja', type: 'Pengeluaran', isDefault: true },
    { id: 'default_panen', name: 'Hasil Panen', type: 'Pemasukan', isDefault: true }
  ];

  const formatRupiah = (number) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
  const formatDate = (dateString) => dateString ? new Date(dateString).toLocaleDateString('id-ID', { year: 'numeric', month: 'short', day: 'numeric' }) : '-';
  const calculateHarvestDate = (start, days) => { const d = new Date(start); d.setDate(d.getDate() + Number(days)); return d.toISOString().split('T')[0]; };
  
  const getHarvestCountdown = (estDate) => {
    const today = new Date();
    today.setHours(0,0,0,0);
    const target = new Date(estDate);
    target.setHours(0,0,0,0);
    const diffTime = target - today;
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    
    if (diffDays < 0) return { text: "Lewat Panen", color: "text-rose-500", bg: "bg-rose-50", urgent: true };
    if (diffDays === 0) return { text: "Hari ini Panen", color: "text-primary", bg: "bg-primary/10", urgent: true };
    if (diffDays <= 7) return { text: `${diffDays} Hari Lagi`, color: "text-amber-500", bg: "bg-amber-50", urgent: true };
    return { text: `${diffDays} Hari Lagi`, color: "text-slate-500", bg: "bg-slate-100", urgent: false };
  };

  const Icon = ({ name, className = "", filled = false }) => (
    <span className={`material-symbols-outlined ${filled ? 'icon-fill' : ''} ${className}`}>{name}</span>
  );

  function App() {
    const [user, setUser] = useState(null);
    const [isAppReady, setIsAppReady] = useState(false);
    const [activeTab, setActiveTab] = useState(TABS.HOME);
    
    // Data States
    const [plantings, setPlantings] = useState([]);
    const [transactions, setTransactions] = useState([]);
    
    // Master Data States
    const [dbCropMasters, setDbCropMasters] = useState([]);
    const [dbCategories, setDbCategories] = useState([]);
    const [loadingData, setLoadingData] = useState(false);

    // Computed Master Data
    const allCrops = useMemo(() => [...DEFAULT_CROPS, ...dbCropMasters], [dbCropMasters]);
    const allCategories = useMemo(() => [...DEFAULT_CATEGORIES, ...dbCategories], [dbCategories]);

    // UI States
    const [showActionSheet, setShowActionSheet] = useState(false);
    const [showAddPlanting, setShowAddPlanting] = useState(false);
    const [showAddTransaction, setShowAddTransaction] = useState(false);
    const [showMasterCrop, setShowMasterCrop] = useState(false);
    const [showMasterCategory, setShowMasterCategory] = useState(false);
    const [toastMsg, setToastMsg] = useState('');
    const [transType, setTransType] = useState('Pengeluaran');

    // Auth States
    const [email, setEmail] = useState('');
    const [password, setPassword] = useState('');
    const [isRegistering, setIsRegistering] = useState(false);
    const [authError, setAuthError] = useState('');
    const [isAuthLoading, setIsAuthLoading] = useState(false);

    // --- INIT AUTH LISTENER ---
    useEffect(() => {
      const checkAuth = setInterval(() => {
        if (window.firebaseModules && auth) {
          clearInterval(checkAuth);
          window.firebaseModules.onAuthStateChanged(auth, (currentUser) => {
            setUser(currentUser);
            setIsAppReady(true);
          });
        }
      }, 200);
      return () => clearInterval(checkAuth);
    }, []);

    // --- DATA FETCHING (Production Paths) ---
    useEffect(() => {
      if (!user || !db) {
        setPlantings([]); setTransactions([]); setDbCropMasters([]); setDbCategories([]);
        return;
      }
      setLoadingData(true);
      const { collection, onSnapshot } = window.firebaseModules;
      
      // Path Firestore disesuaikan untuk Production (Langsung ke users/{uid}/...)
      const pRef = collection(db, 'users', user.uid, 'plantings');
      const tRef = collection(db, 'users', user.uid, 'transactions');
      const cropRef = collection(db, 'users', user.uid, 'crop_masters');
      const catRef = collection(db, 'users', user.uid, 'categories');

      const unsubP = onSnapshot(pRef, snap => setPlantings(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt))));
      const unsubT = onSnapshot(tRef, snap => {
          setTransactions(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => new Date(b.date) - new Date(a.date)));
          setLoadingData(false);
      });
      const unsubCrop = onSnapshot(cropRef, snap => setDbCropMasters(snap.docs.map(d => ({ id: d.id, ...d.data(), color: 'text-primary', bg: 'bg-primary/20', icon: 'potted_plant', image: 'https://images.unsplash.com/photo-1586771107445-d3afaf0def8d?q=80&w=600&auto=format&fit=crop' }))));
      const unsubCat = onSnapshot(catRef, snap => setDbCategories(snap.docs.map(d => ({ id: d.id, ...d.data() }))));

      return () => { unsubP(); unsubT(); unsubCrop(); unsubCat(); };
    }, [user, db]);

    // --- CALCULATIONS ---
    const summary = useMemo(() => {
      let income = 0, expense = 0;
      transactions.forEach(t => {
        if (t.type === 'Pemasukan') income += Number(t.amount);
        else expense += Number(t.amount);
      });
      return { income, expense, balance: income - expense };
    }, [transactions]);

    // --- ACTIONS ---
    const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(''), 3000); };

    const handleAuth = async (e) => {
      e.preventDefault();
      setIsAuthLoading(true); setAuthError('');
      try {
          if (firebaseConfig.apiKey === "GANTI_DENGAN_API_KEY_ANDA") {
            throw new Error("PENTING: Anda belum memasukkan Firebase Config di kode HTML!");
          }
          if (isRegistering) {
              await window.firebaseModules.createUserWithEmailAndPassword(auth, email, password);
              showToast('Akun berhasil dibuat!');
          } else {
              await window.firebaseModules.signInWithEmailAndPassword(auth, email, password);
              showToast('Selamat datang kembali!');
          }
      } catch (err) { 
        if(err.code === 'auth/invalid-credential') setAuthError('Email atau password salah.');
        else if(err.code === 'auth/email-already-in-use') setAuthError('Email sudah terdaftar.');
        else setAuthError(err.message); 
      } finally { setIsAuthLoading(false); }
    };

    const handleGoogleAuth = async () => {
      setIsAuthLoading(true); setAuthError('');
      try {
        if (firebaseConfig.apiKey === "GANTI_DENGAN_API_KEY_ANDA") {
            throw new Error("PENTING: Anda belum memasukkan Firebase Config di kode HTML!");
        }
        await window.firebaseModules.signInWithPopup(auth, googleProvider);
        showToast('Login Google Berhasil!');
      } catch (err) {
        setAuthError(err.message);
      } finally {
        setIsAuthLoading(false);
      }
    }

    const handleLogout = async () => {
      try {
          await window.firebaseModules.signOut(auth);
          setActiveTab(TABS.HOME);
          showToast('Berhasil keluar.');
      } catch (e) { console.error(e); }
    };

    // ACTION: LAHAN
    const handleAddPlanting = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const cropId = fd.get('cropId');
      const selectedCrop = allCrops.find(c => c.id === cropId);
      const estDate = calculateHarvestDate(fd.get('startDate'), selectedCrop.estDays);
      
      try {
        await window.firebaseModules.addDoc(window.firebaseModules.collection(db, 'users', user.uid, 'plantings'), {
          name: fd.get('name'), cropId: cropId, cropName: selectedCrop.name, area: fd.get('area'),
          startDate: fd.get('startDate'), estHarvestDate: estDate, status: 'Aktif', createdAt: new Date().toISOString()
        });
        setShowAddPlanting(false); showToast('Lahan ditambahkan!');
      } catch (err) { showToast('Gagal menambah lahan.'); }
    };

    // ACTION: TRANSAKSI
    const handleAddTransaction = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const catId = fd.get('categoryId');
      const selectedCat = allCategories.find(c => c.id === catId);

      try {
        await window.firebaseModules.addDoc(window.firebaseModules.collection(db, 'users', user.uid, 'transactions'), {
          type: transType, categoryId: catId, categoryName: selectedCat.name,
          desc: fd.get('desc'), amount: Number(fd.get('amount')), date: fd.get('date'), 
          plantingId: fd.get('plantingId') || null, createdAt: new Date().toISOString()
        });
        setShowAddTransaction(false); showToast('Transaksi dicatat!');
      } catch (err) { showToast('Gagal mencatat transaksi.'); }
    };

    const handleDeleteTransaction = async (id) => {
      try {
        await window.firebaseModules.deleteDoc(window.firebaseModules.doc(db, 'users', user.uid, 'transactions', id));
        showToast('Transaksi dihapus.');
      } catch (err) { showToast('Gagal menghapus.'); }
    };

    // ACTION: MASTER DATA
    const handleAddMasterCrop = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        await window.firebaseModules.addDoc(window.firebaseModules.collection(db, 'users', user.uid, 'crop_masters'), {
          name: fd.get('name'), estDays: Number(fd.get('estDays')), createdAt: new Date().toISOString()
        });
        showToast('Master Tanaman ditambahkan!');
        e.target.reset();
      } catch (err) { showToast('Gagal menambah master tanaman.'); }
    };

    const handleAddMasterCategory = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        await window.firebaseModules.addDoc(window.firebaseModules.collection(db, 'users', user.uid, 'categories'), {
          name: fd.get('name'), type: fd.get('type'), createdAt: new Date().toISOString()
        });
        showToast('Kategori Biaya ditambahkan!');
        e.target.reset();
      } catch (err) { showToast('Gagal menambah kategori.'); }
    };

    const handleDeleteMaster = async (collectionName, id) => {
      try {
        await window.firebaseModules.deleteDoc(window.firebaseModules.doc(db, 'users', user.uid, collectionName, id));
        showToast('Data master dihapus.');
      } catch (err) { showToast('Gagal menghapus data.'); }
    };

    // --- VIEWS ---
    if (!isAppReady) return <div className="min-h-screen flex items-center justify-center"><div className="w-10 h-10 border-4 border-primary border-t-transparent rounded-full animate-spin"></div></div>;

    if (!user) {
      return (
        <div className="min-h-screen bg-background-light flex items-center justify-center p-4">
          <div className="bg-white w-full max-w-md p-8 rounded-3xl shadow-xl border border-slate-100 animate-slide-up">
            <div className="w-16 h-16 bg-primary/10 border border-primary/20 rounded-2xl flex items-center justify-center mb-6 text-primary mx-auto">
              <Icon name="eco" className="text-4xl" />
            </div>
            <h1 className="text-2xl font-bold text-slate-900 text-center mb-2">TaniPintar</h1>
            <p className="text-slate-500 text-center text-sm mb-8">
              {isRegistering ? 'Buat profil untuk mulai mengelola' : 'Masuk menggunakan Akun Anda'}
            </p>

            <form onSubmit={handleAuth} className="space-y-4">
              {authError && <div className="bg-red-50 text-red-600 text-sm p-4 rounded-xl border border-red-100 text-center">{authError}</div>}
              <div>
                <label className="block text-sm text-slate-700 mb-1.5 font-medium">Email Akun</label>
                <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} placeholder="petani@email.com" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:ring-2 focus:ring-primary/50 outline-none transition-all text-sm" />
              </div>
              <div>
                <label className="block text-sm text-slate-700 mb-1.5 font-medium">Kata Sandi</label>
                <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Minimal 6 karakter" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:ring-2 focus:ring-primary/50 outline-none transition-all text-sm" />
              </div>
              <button type="submit" disabled={isAuthLoading} className="w-full p-4 bg-primary text-white rounded-2xl font-bold transition-all shadow-lg shadow-primary/30 mt-2 disabled:opacity-70">
                {isAuthLoading ? 'Memproses...' : (isRegistering ? 'Daftar dengan Email' : 'Masuk dengan Email')}
              </button>
            </form>

            <div className="relative my-6">
              <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-slate-200"></div></div>
              <div className="relative flex justify-center text-sm"><span className="px-3 bg-white text-slate-400 font-medium">Atau</span></div>
            </div>

            <button type="button" onClick={handleGoogleAuth} disabled={isAuthLoading} className="w-full p-4 bg-white border border-slate-200 text-slate-700 rounded-2xl font-bold transition-all flex items-center justify-center gap-3 hover:bg-slate-50 disabled:opacity-70">
              <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" className="w-5 h-5"/>
              Lanjutkan dengan Google
            </button>

            <p className="text-center text-sm text-slate-500 font-medium mt-8">
              {isRegistering ? 'Sudah punya akun?' : 'Belum punya akun?'}
              <button type="button" onClick={() => { setIsRegistering(!isRegistering); setAuthError(''); }} className="text-primary font-bold ml-1 hover:underline">
                {isRegistering ? 'Masuk' : 'Daftar'}
              </button>
            </p>
          </div>
        </div>
      );
    }

    return (
      <div className="flex-1 flex flex-col relative bg-background-light">
        
        {/* Header Section */}
        <header className="sticky top-0 z-40 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md px-4 pt-4 pb-3 border-b border-slate-200">
          <div className="flex items-center justify-between mb-4">
            <div className="flex items-center gap-3">
              <div className="size-10 rounded-full overflow-hidden bg-primary/10 flex items-center justify-center border border-primary/20">
                 {user.photoURL ? 
                    <img src={user.photoURL} alt="Profile" className="w-full h-full object-cover" /> :
                    <Icon name="person" className="text-primary" filled={true} />
                 }
              </div>
              <div>
                <p className="text-xs text-slate-500">Selamat datang,</p>
                <h1 className="text-base font-bold text-slate-900 truncate w-40">{user.displayName || user.email.split('@')[0]}</h1>
              </div>
            </div>
            <button className="relative p-2 rounded-xl bg-white border border-slate-200 text-slate-600">
              <Icon name="notifications" />
              <span className="absolute top-2 right-2 size-2 bg-red-500 rounded-full border-2 border-white"></span>
            </button>
          </div>
        </header>

        {toastMsg && <div className="fixed top-24 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-5 py-2.5 rounded-full shadow-xl z-50 animate-fade-in-down text-sm whitespace-nowrap">{toastMsg}</div>}

        <main className="flex-1 pb-24 overflow-y-auto">
          
          {/* TAB: BERANDA */}
          {activeTab === TABS.HOME && (
            <div className="animate-fade-in px-4 space-y-6 mt-4">
              {/* Weather Widget */}
              <div className="bg-primary text-white p-5 rounded-2xl shadow-lg shadow-primary/20 relative overflow-hidden" style={{boxShadow: '0 10px 15px -3px rgba(72, 161, 17, 0.2), 0 4px 6px -2px rgba(72, 161, 17, 0.05)'}}>
                <div className="relative z-10 flex justify-between items-start">
                  <div>
                    <h3 className="text-sm font-medium opacity-90">Cuaca Area Pertanian</h3>
                    <div className="flex items-center gap-2 mt-1">
                      <span className="text-4xl font-bold">28°C</span>
                      <Icon name="light_mode" className="text-yellow-300 text-3xl" filled={true} />
                    </div>
                    <p className="text-xs mt-2 opacity-80">Sangat baik untuk pemupukan hari ini.</p>
                  </div>
                  <div className="text-right">
                    <p className="text-xs font-medium">Lembab: 65%</p>
                    <p className="text-xs font-medium">Angin: 12 km/h</p>
                  </div>
                </div>
                <div className="absolute -right-8 -bottom-8 size-32 bg-white/10 rounded-full"></div>
              </div>

              {/* Summary Cards */}
              <section>
                <h2 className="text-lg font-bold mb-3 flex items-center justify-between text-slate-900">
                  Ringkasan Aktif
                  <span className="text-primary text-xs font-medium cursor-pointer" onClick={()=>setActiveTab(TABS.KEUANGAN)}>Lihat Kas</span>
                </h2>
                <div className="grid grid-cols-2 gap-4">
                  <div className="bg-white p-4 rounded-2xl border border-slate-200">
                    <div className="size-10 bg-primary/10 rounded-xl flex items-center justify-center text-primary mb-3">
                      <Icon name="account_balance_wallet" />
                    </div>
                    <p className="text-xs text-slate-500">Saldo Kas</p>
                    <p className="text-lg font-bold text-slate-900 truncate">{formatRupiah(summary.balance)}</p>
                  </div>
                  <div className="bg-white p-4 rounded-2xl border border-slate-200">
                    <div className="size-10 bg-green-500/10 rounded-xl flex items-center justify-center text-green-600 mb-3">
                      <Icon name="potted_plant" />
                    </div>
                    <p className="text-xs text-slate-500">Tanaman Aktif</p>
                    <p className="text-xl font-bold text-slate-900">{plantings.filter(p => p.status === 'Aktif').length} <span className="text-xs font-normal">Blok</span></p>
                  </div>

                <input required name="name" type="text" placeholder="Nama Kategori (Mis: Biaya Angkut)" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm font-medium" />
                <button type="submit" className="w-full p-3 bg-slate-800 text-white rounded-xl font-bold text-sm">Tambah Kategori</button>
              </form>
            </div>
          </div>
        )}

      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
</body>
</html>
